name: Validate DECCAN LORDS skill pack

on:
  push:
    paths:
      - "skills/**"
      - "scripts/install_deccan_lords_skills.sh"
      - "scripts/validate_deccan_lords_skills.sh"
      - ".github/workflows/validate-deccan-lords-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/install_deccan_lords_skills.sh"
      - "scripts/validate_deccan_lords_skills.sh"
      - ".github/workflows/validate-deccan-lords-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate skill manifests and installer
        run: bash scripts/validate_deccan_lords_skills.sh
